{% extends "admin/base_admin.html" %}
{% block title %}Edit menu item{% endblock %}
{% block content %}
<h1>Edit: {{ item.name }}</h1>
<form method="post" enctype="multipart/form-data" class="admin-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group">
    <label>Name *</label>
    <input name="name" value="{{ item.name }}" required>
  </div>
  <div class="form-group">
    <label>Description</label>
    <textarea name="description" rows="2">{{ item.description or '' }}</textarea>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Price (Rs.) *</label>
      <input name="price" type="number" step="1" value="{{ item.price }}" required>
    </div>
    <div class="form-group">
      <label>Photo</label>
      <input type="file" name="image" accept="image/*">
      {% if item.image_url %}
      <img src="{{ item.image_url }}" alt="" class="preview-img" style="margin-top:0.5rem;max-height:100px">
      {% endif %}
    </div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:1rem;margin:0.75rem 0">
    <label class="check"><input type="checkbox" name="show_on_website" value="1" {% if item.show_on_website %}checked{% endif %}> Website</label>
    <label class="check"><input type="checkbox" name="show_on_qr" value="1" {% if item.show_on_qr %}checked{% endif %}> QR</label>
    <label class="check"><input type="checkbox" name="is_available" value="1" {% if item.is_available %}checked{% endif %}> Available</label>
  </div>
  <button type="submit" class="btn-primary">Save changes</button>
  <a href="{{ url_for('admin.menu') }}" class="btn-link">Cancel</a>
</form>
{% endblock %}
